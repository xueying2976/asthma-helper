name: AeriDay
options:
  bundleIdPrefix: com.aeriday
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  knownRegions:
    - en
    - zh-Hans
  xcodeVersion: "26.3"

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: YES

targets:
  AeriDayCore:
    type: framework
    platform: iOS
    sources:
      - path: AeriDayCore/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aeriday.core
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES

  AeriDayDesignSystem:
    type: framework
    platform: iOS
    sources:
      - path: AeriDayDesignSystem/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aeriday.designsystem
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES

  AeriDay:
    type: application
    platform: iOS
    sources:
      - path: AeriDay
        excludes:
          - Resources/Web
      - path: AeriDay/Resources/Web
        type: folder
        buildPhase: resources
    dependencies:
      - target: AeriDayCore
      - target: AeriDayDesignSystem
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aeriday.app
        PRODUCT_NAME: AeriDay
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: AeriDay/AeriDay.entitlements
        INFOPLIST_FILE: AeriDay/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO

  AeriDayTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AeriDayTests
    dependencies:
      - target: AeriDay
      - target: AeriDayCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aeriday.tests

  AeriDayUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AeriDayUITests
    dependencies:
      - target: AeriDay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aeriday.uitests
        TEST_TARGET_NAME: AeriDay

schemes:
  AeriDay:
    build:
      targets:
        AeriDay: all
        AeriDayCore: [test]
        AeriDayDesignSystem: [test]
        AeriDayTests: [test]
        AeriDayUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: AeriDayTests
          parallelizable: true
        - name: AeriDayUITests
          parallelizable: false
